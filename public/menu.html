<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Menü</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">☕ Cafe Keyif</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Anasayfa</a>
                    <a class="nav-link active" href="menu.html">Menü</a>
                    <a class="nav-link" href="about.html">Hakkımızda</a>
                    <a class="nav-link" href="contact.html">İletişim</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container main-content p-4" style="margin-top: 100px;">
        <h2 class="text-center mb-4 menu-title">Lezzet Menüsü</h2>

        <div class="menu-toolbar mb-3">
            <div class="input-group menu-search">
                <span class="input-group-text" aria-hidden="true">🔍</span>
                <input id="searchInput" type="search" class="form-control" placeholder="Menüde ara..." aria-label="Menüde ara" autocomplete="off">
            </div>
            <div id="categoryChips" class="chips" role="group" aria-label="Kategoriler"></div>
        </div>

        <p id="resultInfo" class="small menu-empty mb-0" aria-live="polite"></p>
        <div id="menuList">
            <p class="text-center menu-empty py-5">Menü yükleniyor...</p>
        </div>
    </div>

    <script>
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // Türkçe karakterlere duyarsız arama: "cay" yazınca "Çay" da bulunur
        const norm = (s) => String(s ?? '').toLocaleLowerCase('tr')
            .replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ı/g, 'i')
            .replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u').trim();

        const emojiFor = (category) => {
            const c = norm(category);
            if (c.includes('kahve')) return '☕';
            if (c.includes('tatli')) return '🍰';
            if (c.includes('soguk')) return '🧊';
            if (c.includes('sicak') || c.includes('cay')) return '🍵';
            if (c.includes('sandvic')) return '🥪';
            if (c.includes('atistir')) return '🥨';
            return '🍽️';
        };

        const ALL = 'Tümü';
        let items = [];
        let activeCategory = ALL;
        let query = '';

        const listEl = document.getElementById('menuList');
        const chipsEl = document.getElementById('categoryChips');
        const infoEl = document.getElementById('resultInfo');
        const searchEl = document.getElementById('searchInput');

        function renderChips() {
            const categories = [ALL, ...new Set(items.map((i) => i.category))];
            chipsEl.innerHTML = categories.map((c) => `
                <button type="button" class="chip ${c === activeCategory ? 'active' : ''}"
                        data-category="${esc(c)}" aria-pressed="${c === activeCategory}">${esc(c)}</button>`).join('');
        }

        function cardHtml(item) {
            const media = item.image
                ? `<img src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy">`
                : `<span class="menu-card__emoji" aria-hidden="true">${emojiFor(item.category)}</span>`;
            const desc = item.description ? esc(item.description) : '';
            return `
                <div class="col-lg-3 col-md-4 col-6">
                    <article class="menu-card card h-100 shadow-sm border-0">
                        <div class="menu-card__media" data-emoji="${emojiFor(item.category)}">${media}</div>
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-start gap-2">
                                <h3 class="menu-card__title">${esc(item.name)}</h3>
                                <span class="menu-card__price">${Number(item.price)} TL</span>
                            </div>
                            <p class="menu-card__desc">${desc}</p>
                        </div>
                    </article>
                </div>`;
        }

        function render() {
            const q = norm(query);
            const filtered = items.filter((i) =>
                (activeCategory === ALL || i.category === activeCategory) &&
                (!q || norm(`${i.name} ${i.description || ''} ${i.category}`).includes(q)));

            infoEl.textContent = q
                ? `"${query.trim()}" için ${filtered.length} ürün bulundu`
                : `${filtered.length} ürün`;

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-5 menu-empty">
                        <div style="font-size: 3rem;">🔎</div>
                        <p class="mb-3">Aramanla eşleşen ürün bulunamadı.</p>
                        <button type="button" id="clearFilters" class="btn btn-primary btn-sm" style="padding: 6px 18px;">Filtreleri temizle</button>
                    </div>`;
                return;
            }

            const groups = new Map();
            filtered.forEach((i) => {
                if (!groups.has(i.category)) groups.set(i.category, []);
                groups.get(i.category).push(i);
            });

            listEl.innerHTML = [...groups].map(([category, list]) => `
                <h4 class="category-heading">${esc(category)}</h4>
                <div class="row g-3">${list.map(cardHtml).join('')}</div>`).join('');
        }

        chipsEl.addEventListener('click', (e) => {
            const btn = e.target.closest('.chip');
            if (!btn) return;
            activeCategory = btn.dataset.category;
            renderChips();
            render();
        });

        searchEl.addEventListener('input', () => {
            query = searchEl.value;
            render();
        });

        listEl.addEventListener('click', (e) => {
            if (e.target.id !== 'clearFilters') return;
            activeCategory = ALL;
            query = '';
            searchEl.value = '';
            renderChips();
            render();
        });

        // Görsel yüklenemezse emoji yer tutucusuna dön
        listEl.addEventListener('error', (e) => {
            if (e.target.tagName !== 'IMG') return;
            const media = e.target.closest('.menu-card__media');
            media.innerHTML = `<span class="menu-card__emoji" aria-hidden="true">${media.dataset.emoji}</span>`;
        }, true);

        function loadMenu() {
            fetch('/api/menu')
                .then((res) => {
                    if (!res.ok) throw new Error('Menü alınamadı');
                    return res.json();
                })
                .then((data) => {
                    items = data;
                    renderChips();
                    render();
                })
                .catch(() => {
                    infoEl.textContent = '';
                    listEl.innerHTML = `
                        <div class="text-center py-5 menu-empty">
                            <p class="mb-3">Menü şu an yüklenemedi.</p>
                            <button type="button" id="retryBtn" class="btn btn-primary btn-sm" style="padding: 6px 18px;">Tekrar dene</button>
                        </div>`;
                    document.getElementById('retryBtn').addEventListener('click', loadMenu);
                });
        }

        loadMenu();
    </script>

    <footer class="footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 text-center text-md-start mb-2 mb-md-0">
                    <span class="footer-text">
                        &copy; 2025 <strong>Cafe Keyif</strong>. Tüm hakları saklıdır.
                    </span>
                </div>

                <div class="col-md-4 text-center mb-2 mb-md-0">
                    <a href="#" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="#" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                </div>

                <div class="col-md-4 text-center text-md-end">
                    <span class="footer-text">
                        <i class="fa-regular fa-clock me-2"></i> 09:00 - 23:00
                    </span>
                </div>

            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
